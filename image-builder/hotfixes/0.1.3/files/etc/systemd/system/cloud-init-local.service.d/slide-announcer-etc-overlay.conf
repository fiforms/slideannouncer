# cloud-init-local.service ships with DefaultDependencies=no and
# Before=sysinit.target — no ordering against /etc's overlay mount, because
# on a stock system /etc is just part of the root filesystem and always
# there. Here it's a CoW overlay (etc.mount) whose upperdir lives on /data,
# only ready after slide-announcer-factory-reset-check.service ->
# data.mount -> slide-announcer-data-dirs.service -> etc.mount. Without
# this, cloud-init-local can win the race and write the NoCloud
# network-config's NetworkManager profile before that chain finishes —
# normally the chain is fast enough that this doesn't happen, but a
# FACTORY_RESET boot adds a real mkfs.ext4 ahead of etc.mount, which is
# enough for cloud-init to lose the profile and require a second reboot to
# pick up WiFi. This forces the ordering instead of relying on the race
# resolving the right way.
[Unit]
After=etc.mount
Requires=etc.mount
