# sshd_config.d drop-in (not an edit to the vendor sshd_config, matching
# this project's other overrides — see e.g. read-only-root/rpi-swap-data.conf)
# disabling password authentication globally, key-based login only.
#
# Installed unconditionally, in every image, regardless of build flags —
# there is no build mode (dev or otherwise) that ever ships a device
# capable of password-over-SSH; a device with SSH reachable at all
# (slideannouncer.yaml's ssh_enabled: true, see system/ssh/ssh-gate.conf)
# only ever accepts a key. This project doesn't bake any key material into
# the image at build time either (see provisioning/firstboot.py's
# sync_ssh_authorized_keys(): the actual authorized_keys content comes
# from slideannouncer.yaml at runtime, every boot) — a device with SSH
# turned on but no key configured simply has no way in at all, by design.
PasswordAuthentication no
PubkeyAuthentication yes
