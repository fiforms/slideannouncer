# Drop-in on the vendor ssh.service (not an edit to the unit file itself)
# gating actual sshd startup on slideannouncer.yaml's `ssh_enabled: true`
# — see ../scripts/ssh-gate.py for what the check does and why. ssh.service
# is unconditionally `systemctl enable`d now (image-builder/config's
# ENABLE_SSH=1) regardless of whether a given build/device ever actually
# wants SSH reachable; this is what makes that decision runtime/yaml-driven
# instead, the same way ssh_authorized_keys already is
# (provisioning/firstboot.py).
#
# After=/Requires=boot-firmware.mount: the gate script reads
# /boot/firmware/slideannouncer.yaml, which needs to actually be mounted
# first — same ordering slide-announcer-vtlock.service already needs for
# the same reason.
[Unit]
After=boot-firmware.mount
Requires=boot-firmware.mount

[Service]
ExecStartPre=/usr/local/sbin/slide-announcer-ssh-gate
