# RAUC's statusfile (system.conf's [system] statusfile=) lives on the
# persistent /data slot, not rootfs — it tracks per-slot boot-count/health
# state that must survive the exact rootfs swap it's bookkeeping for.
# /data isn't mounted at image-build time (its real size is only known on
# real hardware — see repartition.sh), so this directory is created here,
# at boot, instead of during the pi-gen stage.
d /data/rauc 0755 root root -
