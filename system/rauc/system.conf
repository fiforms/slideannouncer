# RAUC slot configuration. See SLIDE_ANNOUNCER.md, Tier 1, for the full
# rationale (self-hosted RAUC over Mender, tryboot over U-Boot).
#
# Slot devices are referenced by PARTUUID (by-partuuid symlink), not by
# device node (/dev/mmcblk0pN vs /dev/sdaN) or by filesystem LABEL. PARTUUID
# comes from the MBR partition-table entry itself and resolves via udev
# whether or not a filesystem/label has ever been written to that partition
# — rootB (and data) deliberately ship with NO filesystem at all until their
# first OTA install/first-boot format (see repartition.sh), so a by-label
# path (/dev/disk/by-label/rootB) would not exist yet on a freshly-flashed
# device. RAUC resolves (realpath) every configured slot's device= at every
# rauc.service startup regardless of that slot's active/booted state —
# confirmed by testing — so an unresolvable device= on a fresh device makes
# rauc.service refuse to start at all, before it could ever perform the OTA
# that would create that filesystem. PARTUUID sidesteps this: it exists from
# the moment the partition table itself is written. These placeholders
# (@@ROOTA_PARTUUID@@/@@ROOTB_PARTUUID@@) are filled in per-device by
# repartition.sh, the same way it already fills fstab's DATADEV placeholder
# — this is safe because system.conf is baked locally per device at build
# time, not shipped inside the fleet-wide OTA bundle (unlike cmdline.txt's
# root=, which does need a fleet-portable LABEL reference instead).
#
# cmdline.txt's root= ALSO switched from LABEL= to PARTUUID= — confirmed by
# testing on real hardware that root=LABEL=... does not reliably resolve
# during a tryboot (os_prefix) boot (panics: "Unable to mount root fs on
# unknown-block(0,0)"), while root=PARTUUID= boots the identical partition
# clean every time. Unlike this file's own by-partuuid device= above,
# cmdline.txt's root= DOES ship inside the fleet-wide OTA bundle, so it
# can't carry a literal build-time PARTUUID constant — the bundle's
# install hook (image-builder/build.sh's hook.sh) resolves the actual
# target PARTUUID dynamically, on-device, via blkid, after the rootfs
# slot's own post-install hook has relabeled the target partition.
#
# RAUC's own *internal* "which slot is currently booted" detection
# (separate from the custom bootloader backend below) does not reliably
# parse root=LABEL=... either — confirmed by testing ("Did not find
# booted slot (matching 'LABEL=rootA')"), though root=PARTUUID= IS
# natively resolvable there per RAUC's docs. rauc.slot=<name> is kept
# anyway (repartition.sh and the bundle's install hook both add it
# alongside root=PARTUUID=) since it's already proven working.
#
# End-to-end hardware validation (flash, install, tryboot reboot, commit)
# completed 2026-08-10 on a real Pi 4. One real bug surfaced along the
# way that reshaped the boot-file layout entirely: a tryboot-*flagged*
# os_prefix boot's DTB-fixup step silently fails to apply the
# vc4-kms-v3d overlay (zero DRM devices, no kiosk display) — a Raspberry
# Pi firmware quirk specific to the tryboot flag, not to os_prefix in
# general. See repartition.sh and rpi-tryboot-commit.sh's own comments
# for the resulting design: config.txt now carries a PERMANENT
# os_prefix=slotA/-or-slotB/ that every normal boot uses (with working
# GPU); a tryboot session is only ever a brief, headless verification
# window, never expected to show anything on screen; committing flips
# that config.txt line (not a file copy) and immediately reboots
# normally. See SLIDE_ANNOUNCER.md's open questions for the remaining
# gap (the post-update health check is still a placeholder).

[system]
compatible=slideannouncer-rpi4
bootloader=custom
statusfile=/data/rauc/central.json

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/rpi-tryboot-backend.sh

[slot.rootfs.0]
device=/dev/disk/by-partuuid/@@ROOTA_PARTUUID@@
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/@@ROOTB_PARTUUID@@
type=ext4
bootname=B

# Kernel/initramfs/cmdline.txt/config.txt live on the single shared FAT32
# boot partition, not inside rootA/rootB (stock Raspberry Pi OS behavior —
# see repartition.sh's slotA/slotB seeding). There's no real block device
# per slot here, so RAUC's default install is fully overridden by a bundle
# hook (image-builder/build.sh writes hook.sh into every bundle,
# manifest.raucm sets hooks=install on [image.kernel]) — RAUC has no
# built-in notion of "a subdirectory inside an already-mounted filesystem"
# as a slot. "custom" is NOT a real RAUC slot type (verified against RAUC
# 1.13: valid types are raw/nand/nor/ubivol/ubifs/ext4/vfat/jffs2 plus the
# boot-* atomic-switch types) — that was this file's original guess and it
# made rauc.service refuse to start ("Unsupported slot type 'custom'").
# type=raw is the closest fit (no filesystem assumptions), and
# allow-mounted=true is RAUC's documented option for "this slot can only
# be updated by a custom install hook" — exactly this case.
#
# parent= ties each kernel slot to its rootfs counterpart as one unit —
# get-primary/set-primary below only ever deal with rootfs.0/rootfs.1;
# kernel.0/kernel.1 are installed alongside whichever rootfs slot a bundle
# targets, with no independent bootname of their own.
#
# device= must be an absolute, always-resolvable path — RAUC realpath()s
# it at every startup regardless of hooks/allow-mounted. A bare token like
# "slotA" resolves relative to system.conf's own directory (/etc/rauc/),
# which doesn't exist there (confirmed by testing: "Failed to resolve
# realpath for '/etc/rauc/slotA'"). repartition.sh always creates
# /boot/firmware/slotA and /boot/firmware/slotB (slotA seeded with real
# content, slotB starts empty but the directory itself always exists), so
# these resolve on a fresh device too. hook.sh derives the A/B letter from
# this path's basename rather than from a bare "slotX" token.
[slot.kernel.0]
device=/boot/firmware/slotA
type=raw
allow-mounted=true
parent=rootfs.0

[slot.kernel.1]
device=/boot/firmware/slotB
type=raw
allow-mounted=true
parent=rootfs.1

# Not part of the A/B scheme at all — a single, always-present slot for
# small ad hoc fixes (a handful of files, a config tweak) on the currently
# booted system, without a full reimage/OTA cycle. No parent=/bootname=
# because it isn't paired with a rootfs slot or involved in boot-primary
# logic; hooks=install (image-builder/make-hotfix-bundle.sh's hook.sh)
# fully owns the install, same pattern as the kernel slots above.
# device=/ (the live root itself, not a placeholder) — allow-mounted=true
# is required for this specifically, since / is always mounted and RAUC
# otherwise refuses to touch a slot device it finds already in use.
[slot.hotfix.0]
device=/
type=raw
allow-mounted=true
