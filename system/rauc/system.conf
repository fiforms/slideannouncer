# RAUC slot configuration. See SLIDE_ANNOUNCER.md, Tier 1, for the full
# rationale (self-hosted RAUC over Mender, tryboot over U-Boot).
#
# Slot devices are referenced by ext4 filesystem LABEL, not by device node
# (/dev/mmcblk0pN vs /dev/sdaN) — image-builder/repartition.sh already
# labels these partitions "rootA"/"rootB", and by-label paths resolve the
# same way whether the device ends up on an SD card or a USB-SSD, so no
# device-node guessing is needed here.
#
# bootloader=custom + bootloader-custom-backend below is a STUB, not a
# working tryboot implementation — RAUC has no built-in Raspberry Pi
# tryboot support, and actual A/B slot switching is explicitly not yet
# implemented (see image-builder/README.md and SLIDE_ANNOUNCER.md's open
# questions). Bundles can be built, signed, transferred, and signature-
# verified against this config; `rauc install` will fail loudly at the
# slot-activation step until the backend script is a real implementation.

[system]
compatible=slideannouncer-rpi4
bootloader=custom
statusfile=/data/rauc/central.json

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/rpi-tryboot-backend.sh

[slot.rootfs.0]
device=/dev/disk/by-label/rootA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-label/rootB
type=ext4
bootname=B
