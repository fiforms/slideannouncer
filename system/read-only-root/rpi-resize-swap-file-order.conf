# rpi-resize-swap-file.service drop-in. rpi-swap-data.conf sizes the
# swapfile at a fixed 2048MiB on the assumption /data is already grown to
# fill the real SD card (see that file's own comment) — but nothing
# otherwise orders this vendor unit against
# slide-announcer-data-resize.service, which is what actually does that
# growing. Confirmed on real hardware: without this, the swapfile attempt
# raced ahead of the resize on a freshly-imaged card, tried to carve 2GiB
# out of the still-128MiB placeholder partition, and took the /etc
# overlay (machine-id, SSH host keys, polkit rules, cloud-init) down with
# it via ENOSPC.
[Unit]
After=slide-announcer-data-resize.service
