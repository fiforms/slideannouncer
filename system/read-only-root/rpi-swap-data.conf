# rpi-swap drop-in (see swap.conf(5) — vendor default at /etc/rpi/swap.conf
# documents swap.conf.d/ as the recommended override mechanism, so this
# doesn't touch the vendor file). Repoints the "zram+file" hybrid's file
# component off its default /var/swap: /var's upper layer is tmpfs (see
# ../README.md, "Read-only rootfs"), so that backing file was backed by
# RAM, not disk — confirmed on real hardware, rpi-resize-swap-file.service
# creates it at full configured size on every boot regardless of actual
# swap usage (a `free`-reported 0 used swap still had the whole file
# resident in /run/overlay-var/upper). zram itself (the other half of the
# hybrid) is fine as-is and untouched here — it's RAM-backed by design and
# was never the problem.
#
# /data is the persistent ext4 partition (see ../../image-builder/repartition.sh)
# — putting the backing file there actually relieves memory pressure onto
# disk. Fixed size rather than the default RAM-percentage auto-sizing, for
# the same SD-card write-endurance/random-I/O reasons as elsewhere in this
# project's swap discussion (see SLIDE_ANNOUNCER.md). 2048MiB rather than a
# smaller value since this file is disk space now, not RAM — cheap even on
# the smallest supported card (32GB, ~20GB free on /data after the OS
# slots) — and rpi-swap also uses it for periodic idle writeback of cold
# zram pages (see /etc/rpi/swap.conf's [Zram] Writeback* keys), not just
# emergency overflow, so more headroom here helps Chromium cache pressure
# specifically, not just a worst-case tail.
#
# No explicit ordering against /data.mount is needed here (contrast
# ../slide-announcer-data-dirs.service, which needs one): rpi-swap-generator
# reads this file at every boot/daemon-reload and derives each unit in its
# activation chain's RequiresMountsFor= from Path= below dynamically —
# confirmed live (`/run/systemd/generator/rpi-resize-swap-file.service.d/
# requires-mounts-for.conf` already tracks whatever Path= currently is).
[File]
Path=/data/swap
FixedSizeMiB=2048
