# /var/log/journal only gets created (switching journald from /run to disk
# persistence) if that directory already exists — since /var is now a
# tmpfs-backed overlay that resets every boot (see /etc/fstab), it never
# would, so this just makes the intent explicit instead of relying on that
# absence. Journals don't need to survive a reboot on this device; nothing
# reads them back across one.
[Journal]
Storage=volatile
