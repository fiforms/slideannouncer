# /var's writable overlay (see /etc/fstab's "overlay /var" line) is backed
# by tmpfs, not /data — it's expected to reset every boot (logs, nginx/NM
# runtime state, caches). /run is itself tmpfs already, so these just need
# to exist fresh each boot before the overlay mount runs; the fstab entry's
# x-systemd.after=systemd-tmpfiles-setup.service ordering depends on that.
d /run/overlay-var 0755 root root -
d /run/overlay-var/upper 0755 root root -
d /run/overlay-var/work 0755 root root -
