# A virtual "All outputs" sink that plays whatever it is given on every audio output
# at once: each HDMI output and the headphone jack. apply-audio-output.py makes it
# the default sink when Settings -> Audio Output is "All outputs"; nothing else uses it.
#
# stream.rules adds a playback stream to each of those sinks as it appears and drops
# it when the display goes away, so hot-plugging a screen needs no re-apply. (USB
# audio is deliberately not matched.) The outputs run on independent clocks, so over
# a long time they can drift slightly out of sync; latency-compensate keeps them
# aligned at the start.
context.modules = [
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "slide_announcer_all_outputs"
            node.description = "All outputs"
            combine.latency-compensate = true
            combine.props = {
                audio.position = [ FL FR ]
                # Never picked automatically over a real output; only by name.
                priority.session = 1
                priority.driver = 1
            }
            stream.props = {
                stream.dont-remix = true
            }
            stream.rules = [
                {   matches = [
                        # HDMI outputs (vc4-hdmi-N)
                        { media.class = "Audio/Sink"  node.name = "~^alsa_output\\..*hdmi.*" }
                        # the 3.5mm headphone jack (bcm2835 mailbox)
                        { media.class = "Audio/Sink"  node.name = "~^alsa_output\\..*mailbox.*" }
                    ]
                    actions = { create-stream = { } }
                }
            ]
        }
    }
]
