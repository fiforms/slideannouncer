# Serves the local-app frontend and proxies /api/* to the backend, which
# only ever listens on loopback. Nothing here is reachable off-device.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /opt/slide-announcer/local-app/frontend/stub;
	index index.html;

	location /api/ {
		proxy_pass http://127.0.0.1:8000/api/;
		proxy_set_header Host $host;
	}

	# Locally-cached slide media, once the real sync daemon exists — served
	# directly by nginx rather than proxied through the backend.
	location /media/ {
		alias /data/slides/media/;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
