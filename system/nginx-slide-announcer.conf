# Serves the local-app frontend (a Vue SPA) and proxies /api/* to the
# backend, which only ever listens on loopback. Nothing here is reachable
# off-device. root points at the `current` symlink
# slide-announcer-local-app-seed.service (and later the updater) maintain
# on /data — nginx follows it at request time, no restart needed when it
# changes (see local-app/README.md, "Installation on the device").
server {
	listen 127.0.0.1:80 default_server;
	listen [::1]:80 default_server;
	server_name _;

	root /data/local-app/current/frontend;
	index index.html;

	location /api/ {
		proxy_pass http://127.0.0.1:8000/api/;
		proxy_set_header Host $host;
	}

	# Locally-cached slide media, once the real sync daemon exists — served
	# directly by nginx rather than proxied through the backend.
	location /media/ {
		alias /data/slides/media/;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
