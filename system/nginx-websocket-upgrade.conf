# http-scope `map` for WebSocket routes a product serves under /api/
# (see nginx-slide-announcer.conf's /api/ location).
# Has to live here, in /etc/nginx/conf.d/ (included at http scope by the
# stock nginx.conf), rather than inside that server block: `map` isn't
# valid inside a location/server block, and setting a hardcoded
# `Connection: upgrade` unconditionally there would ask the backend to
# upgrade on every plain REST request too, defeating HTTP keep-alive to
# it. This only emits "upgrade" when the client's own request actually
# asked for one.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}
