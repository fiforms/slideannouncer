# Installed to /etc/systemd/logind.conf.d/. Without this, logind's own
# default power-key handling (suspend) races
# slide-announcer-power-button.service for the remote's KEY_POWER press —
# and wins, since it's built into logind rather than a plain evdev
# listener. The Pi's suspend/resume path isn't reliable enough to come
# back from (display goes dark, SoC LED stays on, only a physical power
# cycle recovers it), so this hands the key over to our own monitor
# entirely instead. Only takes effect once systemd-logind restarts/reboots.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
